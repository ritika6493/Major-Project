name: Wanderlust CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-test:
    name: Code Quality & Health Audit
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax & Compilation Check
        run: |
          node --check app.js
          node --check config/env.js
          node --check config/logger.js
          node --check services/*.js
          node --check repositories/*.js
          node --check controllers/*.js
          node --check models/*.js
          node --check routes/*.js

      - name: Dependency Security Audit
        run: npm audit --omit=dev --audit-level=critical || true
